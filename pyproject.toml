[project]
name = "flows"
version = "3.0.5"
description = "A workflow engine for Pythonistas"
authors = [
    {name = "Davide Mastromatteo", email = "mastro35@gmail.com"},
]
dependencies = [
    "croniter>=3.0.3",
    "watchdog>=5.0.0",
    "zmq>=0.0.0",
    "pytyler>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

requires-python = ">=3.12.0"
readme = "README.md"
license = {text = "GPLv2"}

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["./src/flows/Actions/"]

[tool.pdm.scripts]
flows = {call = "flows.__main__:main"}

[tool.pdm.dev-dependencies]
dev = [
    "ruff>=0.6.3",
    "pyright>=1.1.378",
    "debugpy>=1.8.5",
]
